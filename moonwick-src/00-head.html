<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#141a3a">
<title>Moonwick — a fairy's tale</title>
<style>
  :root{--u:clamp(38px,12.5vmin,60px);--ink:#2a1f3a;--paper:#f6ecd4;--gold:#f3c96a;--violet:#7a5ad0;--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#10142c;font-family:Georgia,'Times New Roman',serif;color:#f6ecd4;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
  #ui .pe{pointer-events:auto}
  #loader{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 35%,#2c2a66 0%,#0c0e22 78%);transition:opacity 1.2s ease;text-align:center;padding:16px}
  #loader h1{font-size:clamp(34px,11vmin,76px);letter-spacing:.14em;margin:0 0 6px;color:var(--gold);text-shadow:0 3px 0 #6b4a1d,0 0 40px rgba(243,201,106,.45);font-weight:normal}
  #loader .sub{font-style:italic;font-size:clamp(13px,3.6vmin,19px);color:#cfc6ee;margin-bottom:28px}
  #loader .bar{width:min(360px,72vw);height:10px;border:2px solid #b99a5a;border-radius:6px;overflow:hidden;background:#1a1a3a}
  #loader .fill{height:100%;width:0;background:linear-gradient(90deg,#b08aff,#f3d38a);transition:width .25s}
  #loader .msg{margin-top:12px;font-size:13px;color:#a79fd0;min-height:18px}
  #loader.done{opacity:0;pointer-events:none}
  .hud{transition:opacity .4s}.hide{opacity:0!important;pointer-events:none!important}.gone{display:none!important}
  /* objective */
  #obj{position:absolute;left:calc(8px + var(--sl));top:calc(8px + var(--st));max-width:min(46vw,340px);background:rgba(24,20,48,.72);border:1px solid rgba(243,201,106,.5);border-radius:12px;padding:7px 10px;font-size:clamp(11px,2.9vmin,14px);line-height:1.3;backdrop-filter:blur(3px)}
  #obj b{display:block;color:var(--gold);font-size:1.08em;letter-spacing:.03em}#obj.min span{display:none}
  #top{position:absolute;right:calc(8px + var(--sr));top:calc(8px + var(--st));display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end;max-width:50vw}
  .chip{background:rgba(24,20,48,.72);border:1px solid rgba(243,201,106,.45);border-radius:999px;padding:5px 10px;font-size:clamp(11px,2.9vmin,14px);white-space:nowrap}
  .rbtn{width:calc(var(--u)*.78);height:calc(var(--u)*.78);border-radius:50%;background:rgba(24,20,48,.78);border:1.5px solid rgba(243,201,106,.7);color:#fff;font-size:calc(var(--u)*.36);display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit}
  #bagrow{position:absolute;right:calc(8px + var(--sr));top:calc(var(--u)*.78 + 16px + var(--st));display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:44vw}
  #bagrow .chip{padding:3px 8px}
  /* spell bar + mana */
  #spellwrap{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(6px + var(--sb));width:min(calc(100vw - var(--u)*7.4),520px);display:flex;flex-direction:column;align-items:center;gap:3px}
  #spellname{font-size:clamp(11px,2.8vmin,14px);text-shadow:0 1px 3px #000;white-space:nowrap}
  #mana{width:70%;height:6px;border-radius:4px;background:rgba(10,10,30,.7);border:1px solid rgba(180,138,255,.7);overflow:hidden}#mana i{display:block;height:100%;width:50%;background:linear-gradient(90deg,#8a6aff,#ffe9a0)}
  #spells{display:flex;gap:5px;overflow-x:auto;max-width:100%;padding:3px 4px;scrollbar-width:none;touch-action:pan-x}#spells::-webkit-scrollbar{display:none}
  .sp{flex:0 0 auto;width:calc(var(--u)*.74);height:calc(var(--u)*.74);border-radius:12px;background:rgba(24,20,48,.78);border:1.5px solid rgba(255,255,255,.28);font-size:calc(var(--u)*.38);display:flex;align-items:center;justify-content:center;position:relative;color:#fff;padding:0}
  .sp.on{border-color:var(--gold);box-shadow:0 0 12px rgba(243,201,106,.8);background:rgba(70,50,120,.9)}.sp small{position:absolute;right:2px;bottom:0;font-size:9px;color:#cfc6ee;font-family:sans-serif}
  /* touch controls */
  #stick{position:absolute;width:calc(var(--u)*2.3);height:calc(var(--u)*2.3);border-radius:50%;border:2px solid rgba(255,255,255,.28);background:rgba(20,20,50,.25);left:calc(14px + var(--sl));bottom:calc(14px + var(--sb))}
  #stick i{position:absolute;left:50%;top:50%;width:44%;height:44%;margin:-22% 0 0 -22%;border-radius:50%;background:rgba(243,201,106,.55);border:2px solid rgba(255,255,255,.6)}
  #pad{position:absolute;right:calc(10px + var(--sr));bottom:calc(10px + var(--sb));width:calc(var(--u)*3.5);height:calc(var(--u)*3.4)}
  #pad button{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(30,24,60,.62);color:#fff;font-family:inherit;padding:0;display:flex;align-items:center;justify-content:center;line-height:1}
  #pad button.act{background:rgba(243,201,106,.3)}#pad button:active,#pad button.dn{background:rgba(243,201,106,.6)}
  #bCast{right:0;bottom:calc(var(--u)*.75);width:calc(var(--u)*1.35);height:calc(var(--u)*1.35);font-size:calc(var(--u)*.62);border-color:var(--gold)!important}
  #bUp{right:calc(var(--u)*1.5);bottom:calc(var(--u)*1.35);width:var(--u);height:var(--u);font-size:calc(var(--u)*.44)}
  #bDown{right:calc(var(--u)*1.5);bottom:calc(var(--u)*.2);width:var(--u);height:var(--u);font-size:calc(var(--u)*.44)}
  #bDash{right:calc(var(--u)*2.55);bottom:calc(var(--u)*.75);width:calc(var(--u)*.9);height:calc(var(--u)*.9);font-size:calc(var(--u)*.4)}
  #bPos{right:0;bottom:calc(var(--u)*2.25);width:calc(var(--u)*1.05);height:calc(var(--u)*1.05);font-size:calc(var(--u)*.48)}
  #bAct{position:absolute;right:calc(var(--u)*1.3 + 10px + var(--sr));bottom:calc(var(--u)*2.6 + 10px + var(--sb));min-height:calc(var(--u)*.86);max-width:min(58vw,300px);border-radius:999px;border:2px solid var(--gold);background:rgba(60,44,110,.88);color:#fff;font:inherit;font-size:clamp(12px,3.2vmin,16px);padding:6px 14px;box-shadow:0 0 14px rgba(243,201,106,.5)}
  #bAct kbd{background:var(--gold);color:var(--ink);border-radius:5px;padding:0 6px;margin-right:6px;font-family:sans-serif;font-weight:bold}
  #leave{position:absolute;left:50%;transform:translateX(-50%);top:calc(12px + var(--st));border-radius:999px;border:2px solid #fff;background:rgba(120,50,70,.85);color:#fff;font:inherit;font-size:clamp(12px,3.2vmin,16px);padding:7px 16px}
  #hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--u) + 14px + var(--st));font-size:clamp(11px,3vmin,15px);text-shadow:0 1px 4px #000;text-align:center;width:80vw}
  /* text */
  #toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--u)*2.15 + var(--sb));max-width:min(84vw,560px);padding:8px 14px;background:rgba(24,20,48,.86);color:#f6ecd4;border-radius:12px;border:1px solid rgba(243,201,106,.4);font-size:clamp(12px,3.2vmin,16px);text-align:center;opacity:0;transition:opacity .35s}
  #banner{position:absolute;left:0;right:0;top:19%;text-align:center;opacity:0;transition:opacity .6s;text-shadow:0 2px 12px #000,0 0 30px rgba(120,90,208,.9);padding:0 14px}
  #banner b{display:block;font-size:clamp(22px,7.4vmin,48px);font-weight:normal;letter-spacing:.08em;color:var(--gold)}#banner span{font-style:italic;font-size:clamp(12px,3.6vmin,19px)}
  .bub{position:absolute;transform:translate(-50%,-100%);background:rgba(246,236,212,.95);color:var(--ink);border-radius:10px;padding:4px 9px;font-size:clamp(11px,2.9vmin,14px);max-width:min(54vw,250px);text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.4);display:none}
  .emo{position:absolute;transform:translate(-50%,-100%);font-size:clamp(16px,5vmin,26px);font-weight:bold;color:#fff;text-shadow:0 0 6px #000,0 2px 0 #7a3a8a;display:none;font-family:sans-serif}
  #mark{position:absolute;transform:translate(-50%,-50%);color:var(--gold);font-size:clamp(11px,3vmin,14px);text-shadow:0 1px 4px #000;text-align:center;display:none;font-family:sans-serif}#mark i{display:block;font-size:1.7em;font-style:normal;line-height:.9}
  #dlg{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(10px + var(--sb));width:min(94vw,640px);background:rgba(246,236,212,.97);color:var(--ink);border-radius:16px;border:3px solid #b9965a;padding:10px 14px 12px;box-shadow:0 8px 30px rgba(0,0,0,.6);z-index:12}
  #dlg h3{margin:0 0 4px;font-size:clamp(14px,3.8vmin,19px);color:#5a3a8a}#dlg h3 small{font-weight:normal;font-style:italic;color:#8a7a6a;margin-left:8px;font-size:.78em}
  #dlg p{margin:0;font-size:clamp(13px,3.5vmin,17px);line-height:1.38;min-height:2.6em}#dlg .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:8px}
  .btn{border-radius:999px;border:2px solid #5a3a8a;background:#7a5ad0;color:#fff;font:inherit;font-size:clamp(13px,3.4vmin,16px);padding:7px 16px}.btn.alt{background:#f6ecd4;color:#5a3a8a}
  #prog{position:absolute;left:50%;top:58%;transform:translateX(-50%);width:min(60vw,300px);text-align:center;font-size:clamp(12px,3.2vmin,16px);text-shadow:0 1px 4px #000}#prog div{height:10px;border-radius:6px;border:2px solid #fff;background:rgba(0,0,0,.4);overflow:hidden;margin-top:4px}#prog i{display:block;height:100%;background:var(--gold);width:0}
  #ret{position:absolute;left:50%;top:50%;width:26vmin;height:26vmin;margin:-13vmin 0 0 -13vmin;border-radius:50%;border:2px solid rgba(190,220,255,.55);box-shadow:0 0 20px rgba(150,190,255,.35) inset}
  #dot{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 0 5px #000}
  /* title */
  #title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(180deg,rgba(12,14,40,.55),rgba(12,14,40,.1) 45%,rgba(12,14,40,.7));padding:12px;transition:opacity .8s;z-index:20}
  #title h1{font-size:clamp(38px,14vmin,104px);letter-spacing:.14em;margin:0;color:var(--gold);font-weight:normal;text-shadow:0 3px 0 #6b4a1d,0 0 44px rgba(243,201,106,.55)}
  #title .sub{font-style:italic;font-size:clamp(13px,3.8vmin,22px);margin:2px 0 clamp(10px,4vmin,30px);text-shadow:0 2px 8px #000}
  #title .btn{font-size:clamp(15px,4.4vmin,22px);padding:10px 30px;margin:5px}#title .tip{margin-top:clamp(8px,3vmin,22px);font-size:clamp(11px,2.8vmin,14px);color:#d8d0f0;text-shadow:0 1px 4px #000;max-width:620px;line-height:1.45}
  /* journal */
  #jr{position:absolute;inset:0;background:rgba(10,10,30,.7);display:flex;align-items:center;justify-content:center;z-index:25;padding:calc(6px + var(--st)) calc(6px + var(--sr)) calc(6px + var(--sb)) calc(6px + var(--sl))}
  #jr .book{width:min(100%,860px);height:min(100%,640px);background:var(--paper);color:var(--ink);border-radius:16px;border:3px solid #b9965a;display:flex;flex-direction:column;overflow:hidden}
  #jr .tabs{display:flex;overflow-x:auto;background:#e6d6b0;border-bottom:2px solid #b9965a;scrollbar-width:none;flex:0 0 auto;touch-action:pan-x}#jr .tabs::-webkit-scrollbar{display:none}
  #jr .tabs button{flex:0 0 auto;border:0;background:none;font:inherit;font-size:clamp(13px,3.4vmin,16px);padding:9px 13px;color:#6a5a4a}#jr .tabs button.on{background:var(--paper);color:#5a3a8a;font-weight:bold}
  #jr .tabs .x{margin-left:auto;font-size:20px;color:#8a3a4a}
  #jr .pg{flex:1;overflow-y:auto;padding:10px 14px;font-size:clamp(12px,3.2vmin,15px);line-height:1.42;touch-action:pan-y;-webkit-overflow-scrolling:touch}
  #jr h4{margin:10px 0 4px;color:#5a3a8a;font-size:1.1em}#jr .it{display:flex;gap:8px;padding:5px 0;border-bottom:1px dotted #c9b98a;align-items:flex-start}#jr .it .ic{font-size:1.5em;width:1.6em;text-align:center;flex:0 0 auto}#jr .it.off{opacity:.45}
  #jr .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:0 16px}#jr canvas{max-width:100%;border-radius:10px;border:2px solid #b9965a;image-rendering:pixelated;display:block;margin:0 auto}
  #jr label{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dotted #c9b98a}#jr select,#jr input{font:inherit}
  @media (orientation:portrait){#spellwrap{bottom:calc(var(--u)*3.75 + var(--sb));width:94vw}#toast{bottom:calc(var(--u)*5.6 + var(--sb))}#obj{max-width:62vw}#bAct{bottom:calc(var(--u)*5.5 + var(--sb));right:calc(10px + var(--sr))}#top{max-width:34vw}}
  @media (max-height:330px){#spellname{display:none}#obj span{display:none}}
</style>
</head>
<body>
<canvas id="cv" tabindex="0"></canvas>
<div id="ui"></div>
<div id="loader"><h1>MOONWICK</h1><div class="sub">a fairy's tale beneath the Gloaming Spire</div>
  <div class="bar"><div class="fill" id="ldfill"></div></div><div class="msg" id="ldmsg">gathering starlight…</div></div>
