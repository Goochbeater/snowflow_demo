<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Golden Bloom</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0d4c4c;}
  canvas{display:block;width:100vw;height:100vh;touch-action:none;}
  #ui{position:fixed;left:14px;bottom:14px;z-index:2;display:flex;flex-direction:column-reverse;align-items:flex-start;gap:8px;
      font:12px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;color:#f3efe2;user-select:none;-webkit-user-select:none}
  #ui button,#ui select{font:inherit;color:inherit;background:rgba(8,42,46,.42);border:1px solid rgba(255,222,160,.22);
      border-radius:8px;padding:5px 9px;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #ui button:hover,#ui select:hover{background:rgba(30,80,80,.55)}
  #ui button.on{background:rgba(196,132,38,.5);border-color:rgba(255,212,140,.6)}
  #toggle{width:34px;height:34px;padding:0!important;border-radius:50%!important;font-size:15px!important}
  #panel{padding:10px;border-radius:12px;background:rgba(5,32,36,.34);border:1px solid rgba(255,222,160,.13);
      -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 60px)}
  #ui.closed #panel{display:none}
  .row{display:flex;gap:6px;flex-wrap:wrap}
  #panel label{display:flex;align-items:center;gap:8px;opacity:.9}
  #panel input[type=range]{width:130px;accent-color:#e3a540}
  #panel select option{background:#0b3337}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="ui">
  <button id="toggle" title="Controls" aria-label="Toggle controls">◐</button>
  <div id="panel">
    <div class="row">
      <button data-preset="hero" title="Back into the sunlit river">Reset</button>
      <button data-preset="ceiling">Surface ceiling</button>
      <button data-preset="galaxy">Mid-lake galaxy</button>
      <button data-preset="edge">Lake edge</button>
    </div>
    <div class="row"><button id="tour">Auto-drift tour</button></div>
    <label>Density <input id="density" type="range" min="0.25" max="1" step="0.01" value="0.7"></label>
    <label>Quality
      <select id="quality">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
    </label>
  </div>
</div>

<script type="module">
import * as THREE from 'three';

/* ------------------------------------------------------------------ *
 *  World constants
 * ------------------------------------------------------------------ */
const LAKE_A = 240, LAKE_B = 120;           // ellipse half-axes (m)
const SLAB_TOP = -0.35, SLAB_BOT = -13.0;   // the jellyfish live in the sunlit top layer
const FLOW = 0.12;                          // migration drift toward the light (+x), m/s
const riverZ = x => 26 * Math.sin(x * 0.011 + 0.6) + 8 * Math.sin(x * 0.029 + 1.3);
const riverSlope = x => 26 * 0.011 * Math.cos(x * 0.011 + 0.6) + 8 * 0.029 * Math.cos(x * 0.029 + 1.3);

const SUN_EL = 58 * Math.PI / 180, SUN_AZ = 0.22;
const sunAir = new THREE.Vector3(Math.cos(SUN_EL) * Math.cos(SUN_AZ), Math.sin(SUN_EL), Math.cos(SUN_EL) * Math.sin(SUN_AZ));
const sinW = Math.cos(SUN_EL) / 1.333, cosW = Math.sqrt(1 - sinW * sinW);
const toSun = new THREE.Vector3(sinW * Math.cos(SUN_AZ), cosW, sinW * Math.sin(SUN_AZ)); // toward the sun, underwater

const QUALITY = {
  low:    { dpr: 1.0, haze: 220000,  steps: 18 },
  medium: { dpr: 1.5, haze: 600000,  steps: 26 },
  high:   { dpr: 2.0, haze: 1200000, steps: 30 },
};
const HAZE_MAX = QUALITY.high.haze;

/* ------------------------------------------------------------------ *
 *  Procedural textures (tileable noise, caustics, lake field)
 * ------------------------------------------------------------------ */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(20261119);
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

function tileFbm(size, base, oct, seed) {
  const r = mulberry32(seed), out = new Float32Array(size * size);
  let amp = 1;
  for (let o = 0; o < oct; o++) {
    const P = base << o, lat = new Float32Array(P * P);
    for (let i = 0; i < P * P; i++) lat[i] = r();
    for (let y = 0; y < size; y++) {
      const fy = y / size * P, y0 = Math.floor(fy), ty = fy - y0, sy = ty * ty * (3 - 2 * ty), y1 = (y0 + 1) % P;
      for (let x = 0; x < size; x++) {
        const fx = x / size * P, x0 = Math.floor(fx), tx = fx - x0, sx = tx * tx * (3 - 2 * tx), x1 = (x0 + 1) % P;
        const a = lat[y0 * P + x0], b = lat[y0 * P + x1], c = lat[y1 * P + x0], d = lat[y1 * P + x1];
        out[y * size + x] += amp * ((a + (b - a) * sx) * (1 - sy) + (c + (d - c) * sx) * sy);
      }
    }
    amp *= 0.5;
  }
  let mn = 1e9, mx = -1e9;
  for (const v of out) { if (v < mn) mn = v; if (v > mx) mx = v; }
  for (let i = 0; i < out.length; i++) out[i] = (out[i] - mn) / (mx - mn);
  return out;
}
function tileWorleyEdge(size, cells, seed) {
  const r = mulberry32(seed), pts = new Float32Array(cells * cells * 2);
  for (let i = 0; i < cells * cells; i++) { pts[i * 2] = r(); pts[i * 2 + 1] = r(); }
  const out = new Float32Array(size * size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const u = x / size * cells, v = y / size * cells, cx = Math.floor(u), cy = Math.floor(v);
    let f1 = 9, f2 = 9;
    for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
      const gx = cx + i, gy = cy + j, wx = (gx + cells) % cells, wy = (gy + cells) % cells;
      const px = gx + pts[(wy * cells + wx) * 2], py = gy + pts[(wy * cells + wx) * 2 + 1];
      const d = Math.hypot(px - u, py - v);
      if (d < f1) { f2 = f1; f1 = d; } else if (d < f2) f2 = d;
    }
    out[y * size + x] = Math.exp(-(f2 - f1) * 7.0);
  }
  return out;
}
function makeTex(w, h, chans, wrap) {
  const data = new Uint8Array(w * h * 4);
  for (let i = 0; i < w * h; i++) for (let c = 0; c < 4; c++) data[i * 4 + c] = chans[c] ? Math.max(0, Math.min(255, chans[c][i] * 255)) : 255;
  const t = new THREE.DataTexture(data, w, h, THREE.RGBAFormat, THREE.UnsignedByteType);
  t.wrapS = t.wrapT = wrap; t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter;
  t.generateMipmaps = true; t.needsUpdate = true;
  return t;
}
const N256 = 256;
const fbmA = tileFbm(N256, 4, 5, 11), fbmB = tileFbm(N256, 3, 4, 23), fbmLeaf = tileFbm(N256, 16, 3, 37);
const noiseTex = makeTex(N256, N256, [fbmA, fbmB, fbmLeaf, null], THREE.RepeatWrapping);
const causticTex = makeTex(N256, N256, [tileWorleyEdge(N256, 9, 51), tileFbm(N256, 5, 3, 61), null, null], THREE.RepeatWrapping);

// lake-scale field: R = bloom density (migration river), G = jungle canopy cover, B = rim distance
const FW = 512, FH = 256;
const fR = new Float32Array(FW * FH), fG = new Float32Array(FW * FH), fB = new Float32Array(FW * FH);
for (let j = 0; j < FH; j++) for (let i = 0; i < FW; i++) {
  const x = (i + 0.5) / FW * 2 * LAKE_A - LAKE_A, z = (j + 0.5) / FH * 2 * LAKE_B - LAKE_B;
  const r = Math.hypot(x / LAKE_A, z / LAKE_B);
  const dist = r > 1e-3 ? (1 - r) * Math.hypot(x, z) / r : LAKE_B;
  const w = 30 + 9 * Math.sin(x * 0.017 + 2.0), dz = (z - riverZ(x)) / w;
  const river = Math.exp(-dz * dz);
  const light = 0.82 + 0.18 * (x / LAKE_A * 0.5 + 0.5);
  const dens = (0.3 + 0.95 * river) * light * (1 - smooth(0.58, 0.95, r));
  const k = j * FW + i;
  fR[k] = dens / 1.3;
  fG[k] = r >= 1 ? 1 : smooth(14, 2, dist);
  fB[k] = Math.max(0, dist) / 60;
}
const fieldTex = makeTex(FW, FH, [fR, fG, fB, null], THREE.ClampToEdgeWrapping);
const sampleTile = (arr, u, v) => {
  const x = ((u % 1) + 1) % 1 * N256, y = ((v % 1) + 1) % 1 * N256;
  const x0 = Math.floor(x), y0 = Math.floor(y), tx = x - x0, ty = y - y0, x1 = (x0 + 1) % N256, y1 = (y0 + 1) % N256;
  const a = arr[y0 * N256 + x0], b = arr[y0 * N256 + x1], c = arr[y1 * N256 + x0], d = arr[y1 * N256 + x1];
  return (a + (b - a) * tx) * (1 - ty) + (c + (d - c) * tx) * ty;
};

/* ------------------------------------------------------------------ *
 *  Renderer, cameras, render targets
 * ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', alpha: false });
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.autoClear = false;
document.body.prepend(renderer.domElement);
const gl = renderer.getContext();
const MAX_POINT = gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE)[1] || 64;

const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.05, 1400);
const orthoCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const rtBg = new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, depthBuffer: true, depthTexture: new THREE.DepthTexture(4, 4) });
const rtMain = new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, depthBuffer: true });
const rtRays = new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, depthBuffer: false });

/* ------------------------------------------------------------------ *
 *  Shared uniforms + GLSL
 * ------------------------------------------------------------------ */
const U = {
  uTime: { value: 0 }, uDensity: { value: 0.7 },
  uField: { value: fieldTex }, uNoise: { value: noiseTex }, uCaustic: { value: causticTex },
  uToSun: { value: toSun }, uSunAir: { value: sunAir }, uFwd: { value: new THREE.Vector3(1, 0, 0) },
  uFogK: { value: 0.028 }, uPxScale: { value: 800 }, uRes: { value: new THREE.Vector2(1, 1) },
  uMaxPt: { value: MAX_POINT }, uBg: { value: rtBg.texture },
};

const COMMON = /* glsl */`
#define LAKE_A ${LAKE_A.toFixed(1)}
#define LAKE_B ${LAKE_B.toFixed(1)}
#define SLAB_TOP ${SLAB_TOP.toFixed(2)}
#define SLAB_BOT ${SLAB_BOT.toFixed(2)}
#define FLOW ${FLOW.toFixed(3)}
uniform float uTime, uDensity, uFogK, uPxScale, uMaxPt;
uniform sampler2D uField, uNoise, uCaustic;
uniform vec3 uToSun, uSunAir, uFwd;

float hash11(float p){ p = fract(p*.1031); p *= p + 33.33; p *= p + p; return fract(p); }
vec3 hash31(float p){ vec3 p3 = fract(vec3(p)*vec3(.1031,.1030,.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xxy + p3.yzz)*p3.zyx); }
float hashU(uint x){ x ^= x >> 16; x *= 0x7feb352du; x ^= x >> 15; x *= 0x846ca68bu; x ^= x >> 16; return float(x) / 4294967295.0; }

vec4 fieldAt(vec2 xz){ return textureLod(uField, xz / vec2(2.0*LAKE_A, 2.0*LAKE_B) + 0.5, 0.0); }

// bloom density: migration river x drifting clouds x vertical preference for sunlit water
float densityAt(vec3 p){
  float base = fieldAt(p.xz).r * 1.3;
  float cl  = textureLod(uNoise, (p.xz - vec2(uTime*FLOW, 0.0)) / 95.0, 0.0).r;
  float cl2 = textureLod(uNoise, (p.xz - vec2(uTime*FLOW, 0.0)) / 27.0 + vec2(p.y*0.021, 0.37), 0.0).g;
  float yf = smoothstep(SLAB_BOT, SLAB_BOT + 4.0, p.y) * (0.5 + 0.5*smoothstep(-9.0, -1.5, p.y));
  return base * (0.10 + 1.7*smoothstep(0.36, 0.70, cl)) * (0.35 + 0.95*cl2) * yf;
}

// light shafts / leaf-dappled sunlight entering at the surface
float shaftAt(vec3 p){
  vec2 e = p.xz + uToSun.xz / uToSun.y * (-p.y);
  float s  = textureLod(uCaustic, e/14.0 + uTime*vec2(0.0035, 0.0021), 0.0).g;
  float s2 = textureLod(uCaustic, e/5.5  - uTime*vec2(0.0060, 0.0042), 0.0).g;
  float sh = smoothstep(0.55, 0.88, s*0.68 + s2*0.40);
  float cover = fieldAt(e).g;
  if (cover > 0.01){
    float lf = textureLod(uNoise, e/1.9 + vec2(sin(uTime*0.7), cos(uTime*0.53))*0.018, 0.0).b;
    sh = mix(sh, smoothstep(0.56, 0.72, lf)*0.9, cover);
  }
  return sh;
}
float causticAt(vec3 p){
  vec2 e = p.xz + uToSun.xz / uToSun.y * (-p.y);
  float a = textureLod(uCaustic, e/3.6 + uTime*vec2(0.021, 0.013), 0.0).r;
  float b = textureLod(uCaustic, e/5.3 - uTime*vec2(0.015, 0.019), 0.0).r;
  float c = a*b*2.2 + 0.25*(a+b);
  float cover = fieldAt(e).g;
  return c * (1.0 - 0.75*cover) * exp(p.y*0.06);
}

vec3 waterColor(vec3 d, vec3 ro){
  float up = d.y;
  vec3 deep = vec3(0.003, 0.020, 0.032);
  vec3 midc = vec3(0.010, 0.165, 0.185);
  vec3 hi   = vec3(0.070, 0.480, 0.470);
  vec3 c = mix(midc, hi, smoothstep(-0.1, 0.9, up));
  c = mix(c, deep, smoothstep(0.05, 0.8, -up));
  c = mix(c, vec3(0.05, 0.02, 0.04), smoothstep(0.55, 0.95, -up)*0.5);   // the dim anoxic layer below
  float sa = max(dot(d, uToSun), 0.0);
  c += vec3(0.30, 0.55, 0.42) * pow(sa, 5.0) * 0.55 + vec3(0.03, 0.07, 0.05) * sa;
  float depthK = exp(min(ro.y, 0.0) * 0.03);
  c *= depthK;
  // the golden bloom itself hazes the water
  float lenS = d.y > 0.0 ? (SLAB_TOP - ro.y) / max(d.y, 1e-3) : (SLAB_BOT - ro.y) / min(d.y, -1e-3);
  lenS = clamp(lenS, 0.0, 90.0);
  vec3 p1 = ro + d*min(12.0, lenS), p2 = ro + d*min(38.0, lenS);
  p1.y = clamp(p1.y, SLAB_BOT, SLAB_TOP); p2.y = clamp(p2.y, SLAB_BOT, SLAB_TOP);
  float dens = 0.45*densityAt(p1) + 0.55*densityAt(p2);
  float haze = clamp(dens*uDensity, 0.0, 1.6) * (1.0 - exp(-lenS/16.0));
  vec3 amber = vec3(0.86, 0.50, 0.15) * (0.28 + 0.55*smoothstep(-0.4, 0.7, up) + 0.6*pow(sa, 3.0)) * depthK;
  return mix(c, amber, clamp(haze*0.42, 0.0, 0.55));
}
float fogF(float dist){ return 1.0 - exp(-dist*uFogK); }

vec3 litSurface(vec3 albedo, vec3 N, vec3 W){
  float cover = fieldAt(W.xz).g;
  float light = exp(W.y*0.075) * (1.0 - 0.7*cover);
  float caus = causticAt(W);
  vec3 amb = vec3(0.10, 0.28, 0.28) * (0.55 + 0.45*N.y) * exp(W.y*0.04);
  vec3 sun = vec3(1.0, 0.94, 0.82) * max(dot(N, uToSun), 0.0) * light * (0.35 + 1.4*caus);
  return albedo * (amb + sun);
}

struct Jelly { vec3 c; vec3 axis; float scale; float pulse; float vis; float seed; float glow; float spin; float dist; };

float pulseCurve(float f){ return f < 0.24 ? smoothstep(0.0, 0.24, f) : 1.0 - smoothstep(0.24, 1.0, f); }

// cell.y <= 0 : slab layer (no vertical wrap)
Jelly makeJelly(vec3 base, float seed0, vec3 cell, float partR){
  Jelly j;
  vec3 h = hash31(seed0*91.7 + 0.31);
  float freq = 0.5 + 0.5*h.x;
  float ph = uTime*freq + h.y*17.0;
  float f = fract(ph);
  j.pulse = pulseCurve(f);
  float stroke = floor(ph) + smoothstep(0.0, 0.4, f);
  vec2 tilt = (h.zx - 0.5)*0.75 + vec2(0.16, 0.04);
  j.axis = normalize(vec3(tilt.x, 1.0, tilt.y));
  vec2 drift = vec2(uTime*FLOW, 0.0) + j.axis.xz*stroke*0.035;
  vec3 rel = vec3(base.x + drift.x, base.y, base.z + drift.y) - cameraPosition;
  vec3 k = vec3(floor(rel.x/cell.x + 0.5), 0.0, floor(rel.z/cell.z + 0.5));
  rel.x -= k.x*cell.x; rel.z -= k.z*cell.z;
  if (cell.y > 0.0){ k.y = floor(rel.y/cell.y + 0.5); rel.y -= k.y*cell.y; }
  j.seed = hash11(seed0*13.1 + k.x*7.13 + k.z*13.77 + k.y*3.31 + 0.5);
  vec3 p = cameraPosition + rel;
  p.y += 0.035*j.pulse + sin(uTime*0.11 + j.seed*40.0)*0.22;
  float sz = hash11(j.seed*5.7 + 1.3);
  j.scale = 0.085 + 0.075*sz*sz;
  float hv = hash11(j.seed*3.3 + 0.7);
  float dens = densityAt(p) * uDensity;
  j.vis = smoothstep(hv - 0.06, hv + 0.06, dens);
  j.vis *= (1.0 - smoothstep(SLAB_TOP - 0.45, SLAB_TOP, p.y)) * smoothstep(SLAB_BOT, SLAB_BOT + 1.0, p.y);
  j.glow = 0.0;
  if (partR > 0.0){
    // jellyfish part softly around the swimmer (a short capsule reaching ahead)
    vec3 d = p - cameraPosition;
    float a = clamp(dot(d, uFwd), 0.0, 1.8);
    vec3 q = d - uFwd*a + (h - 0.5)*0.02;
    float r = length(q);
    float w = 1.0 - smoothstep(0.0, partR*1.7, r);
    float rn = mix(r, partR + 0.25*r, w);
    p = cameraPosition + uFwd*a + q/max(r, 1e-4)*rn;
    j.glow = (1.0 - smoothstep(partR*0.9, partR*2.1, r)) * (1.0 - smoothstep(1.2, 3.0, length(d)));
  }
  j.c = p;
  j.spin = uTime*(0.10 + 0.2*h.x) + j.seed*6.2831;
  j.dist = length(p - cameraPosition);
  return j;
}
`;

const FSQ_VERT = /* glsl */`varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

function mat(params) {
  return new THREE.ShaderMaterial(Object.assign({ uniforms: Object.assign({}, U, params.extra || {}) }, params.opts || {}, {
    vertexShader: COMMON + params.vs, fragmentShader: COMMON + params.fs,
  }));
}

/* ------------------------------------------------------------------ *
 *  Background scene: water, surface, rim, roots, snorkeler, far bloom
 * ------------------------------------------------------------------ */
const bgScene = new THREE.Scene();
const nearScene = new THREE.Scene();

// --- water volume (dome following the camera)
const dome = new THREE.Mesh(new THREE.SphereGeometry(1000, 48, 24), mat({
  vs: `varying vec3 vW; void main(){ vec4 w = modelMatrix*vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }`,
  fs: `varying vec3 vW; void main(){ vec3 d = normalize(vW - cameraPosition); gl_FragColor = vec4(waterColor(d, cameraPosition), 1.0); }`,
  opts: { side: THREE.BackSide, depthWrite: false },
}));
dome.renderOrder = -10; dome.frustumCulled = false;
bgScene.add(dome);

// --- the surface ceiling: Snell's window onto jungle + sky, mirrored underside outside it
const surfGeo = new THREE.PlaneGeometry(900, 900, 1, 1); surfGeo.rotateX(Math.PI / 2);
const surface = new THREE.Mesh(surfGeo, mat({
  vs: `varying vec3 vW; void main(){ vec4 w = modelMatrix*vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }`,
  fs: /* glsl */`
  varying vec3 vW;
  float ripH(vec2 p){
    return texture(uNoise, p/9.0 + uTime*vec2(0.011, 0.006)).r + 0.55*texture(uNoise, p/3.4 + uTime*vec2(-0.009, 0.014)).g;
  }
  float rayExit(vec2 p, vec2 dir, vec2 ab){
    vec2 P = p/ab, D = dir/ab;
    float a = dot(D,D), b = dot(P,D), c = dot(P,P) - 1.0;
    if (c > 0.0) return 0.0;
    return (-b + sqrt(max(b*b - a*c, 0.0)))/a;
  }
  vec3 skyJungle(vec3 a, vec2 p){
    float horiz = max(length(a.xz), 1e-4);
    vec2 dh = a.xz/horiz;
    float elev = a.y;
    vec3 sky = mix(vec3(0.72, 0.86, 0.96), vec3(0.22, 0.48, 0.90), smoothstep(0.0, 0.85, elev)) * 1.45;
    float sd = max(dot(a, uSunAir), 0.0);
    sky += vec3(1.0, 0.95, 0.85) * (pow(sd, 1400.0)*60.0 + pow(sd, 40.0)*2.0 + pow(sd, 6.0)*0.5);
    vec3 col = sky;
    float D = rayExit(p, dh, vec2(LAKE_A, LAKE_B) - 9.0);
    if (D > 0.0){
      vec2 hp = p + dh*D;
      float th = 28.0 + 34.0*texture(uNoise, hp/70.0).r + 8.0*texture(uNoise, hp/12.0).g;
      float hh = D*elev/horiz;
      float edge = th - hh;
      if (edge > -0.5){

// --- near: instanced amber medusae with transmission-style translucency (two LODs)
function buildJellyGeometry(detail) {
  const P = [], N = [], PART = [], T = [], I = []; let base = 0;
  const grid = (rows, cols, fn, part) => {
    for (let i = 0; i <= rows; i++) for (let j = 0; j <= cols; j++) { const r = fn(i / rows, j / cols); P.push(...r.p); N.push(...r.n); PART.push(part); T.push(r.t); }
    for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++) { const a = base + i * (cols + 1) + j, b = a + cols + 1; I.push(a, b, a + 1, b, b + 1, a + 1); }
    base += (rows + 1) * (cols + 1);
  };
  const hi = detail === 'high';
  // bell (profile param s: 0 apex -> 1 margin)
  grid(hi ? 11 : 6, hi ? 22 : 12, (s, u) => {
    const th = s * 1.62, a = u * Math.PI * 2, r = Math.sin(th), y = Math.cos(th) * 0.78;
    let nr = 0.78 * Math.sin(th), ny = Math.cos(th); const l = Math.hypot(nr, ny); nr /= l; ny /= l;
    return { p: [r * Math.cos(a), y, r * Math.sin(a)], n: [nr * Math.cos(a), ny, nr * Math.sin(a)], t: s };
  }, 0);
  if (hi) {
    grid(4, 6, (t, u) => { const b = u * Math.PI * 2, rad = 0.22 * (1 - 0.45 * t), y = -0.02 - t * 0.38;
      return { p: [rad * Math.cos(b), y, rad * Math.sin(b)], n: [Math.cos(b), 0, Math.sin(b)], t: t * 0.4 }; }, 1);
  }
  // eight frilled oral arms + terminal clubs
  for (let k = 0; k < 8; k++) {
    const ak = k / 8 * Math.PI * 2 + 0.2, ca = Math.cos(ak), sa = Math.sin(ak);
    grid(hi ? 8 : 4, hi ? 5 : 3, (t, u) => {
      const b = u * Math.PI * 2, cr = 0.12 + 0.2 * t, cy = -0.06 - t * 0.86;
      const rad = 0.075 * (1 - 0.5 * t) * (1 + 0.3 * Math.sin(t * 19 + k));
      return { p: [ca * cr + rad * Math.cos(b), cy, sa * cr + rad * Math.sin(b)], n: [Math.cos(b), 0, Math.sin(b)], t };
    }, 1);
    if (hi) {
      const cx = ca * 0.33, cz = sa * 0.33, cy = -1.02, rx = 0.045, ry = 0.11;
      grid(4, 5, (s, u) => {
        const th = s * Math.PI, b = u * Math.PI * 2;
        const nx = Math.sin(th) * Math.cos(b) / rx, ny = Math.cos(th) / ry, nz = Math.sin(th) * Math.sin(b) / rx, nl = Math.hypot(nx, ny, nz) || 1;
        return { p: [cx + Math.sin(th) * Math.cos(b) * rx, cy + Math.cos(th) * ry, cz + Math.sin(th) * Math.sin(b) * rx], n: [nx / nl, ny / nl, nz / nl], t: 1 };
      }, 2);
    }
  }
  const g = new THREE.InstancedBufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(N, 3));
  g.setAttribute('aPart', new THREE.Float32BufferAttribute(PART, 1));
  g.setAttribute('aT', new THREE.Float32BufferAttribute(T, 1));
  g.setIndex(I);
  return g;
}

const BELL_FS = /* glsl */`
  uniform sampler2D uBg; uniform vec2 uRes;
  varying vec3 vW, vN, vL; varying float vPart, vT, vGlow, vFade, vPulse, vSeed;
  void main(){
    if (vFade < 0.01) discard;
    vec3 N = normalize(vN); if (!gl_FrontFacing) N = -N;
    vec3 V = normalize(cameraPosition - vW);
    float ndv = abs(dot(N, V));
    float fres = pow(1.0 - ndv, 3.0);
    float caus = causticAt(vW);
    float shade = 1.0 - 0.7*fieldAt(vW.xz).g;
    float lightD = exp(vW.y*0.07)*shade;
    float lit = 0.4 + 0.6*max(dot(N, uToSun), 0.0);
    vec3 Nv = mat3(viewMatrix)*N;
    vec2 suv = gl_FragCoord.xy/uRes + Nv.xy*0.03*(0.35 + ndv);
    vec3 bg = texture(uBg, clamp(suv, 0.001, 0.999)).rgb;
    vec3 amber = vec3(1.0, 0.58, 0.16);
    vec3 col;
    if (vPart < 0.5){
      float s = vT;
      vec3 tint = mix(vec3(1.0, 0.84, 0.55), vec3(1.0, 0.62, 0.26), s);
      col = bg*tint*0.78;
      float core = exp(-3.2*length(vL - vec3(0.0, 0.42, 0.0)));
      float ang = atan(vL.z, vL.x) + vSeed*3.0;
      float canal = pow(abs(cos(ang*4.0)), 16.0)*smoothstep(0.25, 0.95, s);
      float spots = smoothstep(0.82, 0.9, texture(uNoise, vec2(ang*0.32, s*0.6) + vSeed).b)*(1.0 - s);
      vec3 em = amber*(0.12 + 0.42*core + 0.18*canal)*(1.0 + vGlow*1.8);
      col += em;
      col += amber*lit*lightD*(0.25 + 1.1*caus)*0.7;
      col += fres*vec3(1.0, 0.80, 0.48)*0.5*(0.5 + lightD);
      col += smoothstep(0.86, 1.0, s)*vec3(1.0, 0.82, 0.55)*0.22;
      col += spots*vec3(0.9, 0.85, 0.7)*0.15*lightD;
      col += vGlow*vec3(1.0, 0.72, 0.32)*0.18*(0.6 + 0.4*sin(uTime*3.0 + vSeed*20.0));
    } else if (vPart < 1.5){
      vec3 armC = mix(vec3(0.62, 0.32, 0.08), vec3(0.85, 0.55, 0.20), vT);
      col = mix(bg*vec3(0.95, 0.62, 0.30), armC*(0.25 + 0.75*lit*lightD*(0.5 + caus)), 0.62);
      col += amber*0.10*(1.0 + vGlow*2.0) + fres*amber*0.15;
    } else {
      col = vec3(0.82, 0.80, 0.76)*(0.18 + 0.5*lit*lightD) + bg*0.35 + amber*0.05;
    }
    float dist = length(vW - cameraPosition);
    col = mix(col, waterColor(-V, cameraPosition), fogF(dist));
    gl_FragColor = vec4(col, vFade);
  }`;

function makeBellLayer(geo, cell, count, fade, partR, name) {
  const g = geo.clone();
  const base = new Float32Array(count * 3), seed = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    base[i * 3] = (rnd() - 0.5) * cell; base[i * 3 + 1] = (rnd() - 0.5) * cell; base[i * 3 + 2] = (rnd() - 0.5) * cell;
    seed[i] = rnd();
  }
  g.setAttribute('iBase', new THREE.InstancedBufferAttribute(base, 3));
  g.setAttribute('iSeed', new THREE.InstancedBufferAttribute(seed, 1));
  g.instanceCount = count;
  const m = new THREE.Mesh(g, mat({
    extra: { uCell: { value: new THREE.Vector3(cell, cell, cell) }, uFade: { value: new THREE.Vector4(...fade) }, uPartR: { value: partR } },
    vs: BELL_VS, fs: BELL_FS, opts: { side: THREE.DoubleSide, transparent: true, depthWrite: true },
  }));
  m.frustumCulled = false; m.name = name;
  nearScene.add(m);

}

// --- silver fry
{
  const v = [
    0.022, 0, 0,   0, 0.0055, 0,   0, -0.005, 0,   0, 0, 0.0035,   0, 0, -0.0035,
    -0.014, 0, 0,  -0.023, 0.0065, 0,   -0.023, -0.0065, 0,
  ];
  const idx = [0, 1, 3, 0, 3, 2, 0, 2, 4, 0, 4, 1, 5, 3, 1, 5, 2, 3, 5, 4, 2, 5, 1, 4, 5, 6, 7];
  const g = new THREE.InstancedBufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3)); g.setIndex(idx);
  const PER = 11, n = HOSTS * PER;
  const ib = new Float32Array(n * 3), is = new Float32Array(n), ifs = new Float32Array(n * 4);
  for (let h = 0; h < HOSTS; h++) for (let k = 0; k < PER; k++) {
    const i = h * PER + k;
    ib[i * 3] = hosts.base[h * 3]; ib[i * 3 + 1] = hosts.base[h * 3 + 1]; ib[i * 3 + 2] = hosts.base[h * 3 + 2]; is[i] = hosts.seed[h];
    ifs[i * 4] = rnd() * 6.283; ifs[i * 4 + 1] = rnd(); ifs[i * 4 + 2] = rnd(); ifs[i * 4 + 3] = (0.5 + rnd() * 0.9) * (rnd() < 0.5 ? -1 : 1);
  }
  g.setAttribute('iBase', new THREE.InstancedBufferAttribute(ib, 3));
  g.setAttribute('iSeed', new THREE.InstancedBufferAttribute(is, 1));
  g.setAttribute('iFish', new THREE.InstancedBufferAttribute(ifs, 4));
  g.instanceCount = n;
  const fry = new THREE.Mesh(g, mat({
    extra: { uCell: { value: new THREE.Vector3(NEAR_B_CELL, NEAR_B_CELL, NEAR_B_CELL) }, uPartR: { value: 0.9 } },
    vs: /* glsl */`
    attribute vec3 iBase; attribute float iSeed; attribute vec4 iFish;
    uniform vec3 uCell; uniform float uPartR;
    varying vec3 vW; varying float vY;
    void main(){
      Jelly j = makeJelly(iBase, iSeed, uCell, uPartR);
      float fade = j.vis*(1.0 - smoothstep(4.4, 5.2, j.dist));
      if (fade < 0.35){ gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
      float a = uTime*iFish.w + iFish.x + sin(uTime*0.7 + iFish.x)*0.4;
      float rr = j.scale*(0.35 + iFish.y*1.0)*(1.0 + j.glow*1.6);
      vec3 center = j.c - j.axis*j.scale*(0.45 + iFish.z*1.1);
      vec3 pos = center + vec3(cos(a)*rr, sin(a*1.3 + iFish.x*3.0)*0.03, sin(a)*rr);
      vec3 fw = normalize(vec3(-sin(a), 0.0, cos(a))*sign(iFish.w));
      vec3 upv = vec3(0.0, 1.0, 0.0), side = normalize(cross(fw, upv));
      vec3 v = position;
      float tail = clamp(-v.x/0.02, 0.0, 1.0);
      v.z += sin(uTime*19.0 + iFish.x*7.0)*0.007*tail;
      vY = v.y;
      vW = pos + fw*v.x + upv*v.y + side*v.z;

    fs: /* glsl */`
    varying vec3 vW; varying float vY;
    void main(){
      vec3 N = normalize(cross(dFdx(vW), dFdy(vW)));

      if (dot(N, V) < 0.0) N = -N;
      vec3 base = mix(vec3(0.10, 0.16, 0.20), vec3(0.62, 0.68, 0.72), smoothstep(0.003, -0.003, vY));
      float light = exp(vW.y*0.07);
      float flash = pow(max(dot(reflect(-V, N), uToSun), 0.0), 6.0);
      vec3 col = base*(0.25 + 0.5*light) + vec3(0.9, 0.95, 1.0)*flash*1.6*light;
      col = mix(col, waterColor(-V, cameraPosition), fogF(length(vW - cameraPosition)));
      gl_FragColor = vec4(col, 1.0);

    opts: { side: THREE.DoubleSide },
  }));

// --- dust-mote plankton glittering in the beams
{
  const L = 14, n = 18000, a = new Float32Array(n * 3);

    uniform float uL; varying float vB;
    void main(){

      vec3 b = position + vec3(uTime*FLOW*0.6, sin(uTime*0.07 + s0*30.0)*0.4, cos(uTime*0.05 + s0*20.0)*0.4);
      vec3 rel = b - cameraPosition; rel -= uL*floor(rel/uL + 0.5);
      vec3 p = cameraPosition + rel; float d = length(rel);
      if (p.y > -0.08 || d < 0.12){ gl_Position = vec4(2.0, 2.0, 2.0, 1.0); gl_PointSize = 0.0; return; }
      float fade = smoothstep(0.12, 0.6, d)*(1.0 - smoothstep(uL*0.32, uL*0.5, d));
      vec4 mv = viewMatrix*vec4(p, 1.0);
      gl_Position = projectionMatrix*mv;

      gl_PointSize = clamp(px, 1.0, 7.0);
      vB = (0.06 + 1.6*shaftAt(p))*fade*exp(p.y*0.05)*(0.4 + s0)*min(1.0, px);
    }`,
    fs: /* glsl */`
    varying float vB;
    void main(){ vec2 q = gl_PointCoord*2.0 - 1.0; float d2 = dot(q, q); if (d2 > 1.0) discard;
      gl_FragColor = vec4(vec3(0.85, 0.95, 0.88)*vB*(1.0 - d2), 1.0); }`,

const fsqGeo = new THREE.PlaneGeometry(2, 2);
const raysMat = mat({
  extra: {
    tDepth: { value: rtBg.depthTexture }, uInvVP: { value: new THREE.Matrix4() }, uCamPos: { value: new THREE.Vector3() },
    uCamFwd: { value: new THREE.Vector3() }, uNear: { value: camera.near }, uFar: { value: camera.far }, uSteps: { value: 26 },
  },
  vs: FSQ_VERT,
  fs: /* glsl */`
  uniform sampler2D tDepth; uniform mat4 uInvVP; uniform vec3 uCamPos, uCamFwd; uniform float uNear, uFar; uniform int uSteps;
  varying vec2 vUv;
  void main(){
    vec4 w = uInvVP*vec4(vUv*2.0 - 1.0, 1.0, 1.0);
    vec3 dir = normalize(w.xyz/w.w - uCamPos);
    float dz = texture(tDepth, vUv).r;
    float viewZ = (uNear*uFar)/((uFar - uNear)*dz - uFar);
    float tMax = min(46.0, -viewZ/max(dot(dir, uCamFwd), 1e-3));
    if (dir.y > 0.0) tMax = min(tMax, -uCamPos.y/dir.y);
    float jit = fract(52.9829189*fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));
    float acc = 0.0, N = float(uSteps);
    for (int i = 0; i < 64; i++){
      if (i >= uSteps) break;
      float u = (float(i) + jit)/N;
      float t = tMax*pow(u, 1.6);
      float dt = tMax*1.6*pow(u, 0.6)/N;
      vec3 p = uCamPos + dir*t;
      acc += shaftAt(p)*exp(p.y*0.05)*exp(-t*0.045)*dt;
    }
    float mu = max(dot(dir, uToSun), 0.0);
    float phase = 0.3 + 0.5*mu + 1.6*pow(mu, 6.0);
    gl_FragColor = vec4(vec3(0.62, 0.95, 0.82)*acc*phase*0.13, 1.0);
  }`,
  opts: { depthTest: false, depthWrite: false },
});
const raysScene = new THREE.Scene(); { const m = new THREE.Mesh(fsqGeo, raysMat); m.frustumCulled = false; raysScene.add(m); }

const compMat = new THREE.ShaderMaterial({

const finalMat = new THREE.ShaderMaterial({
  uniforms: { tMain: { value: rtMain.texture }, uExposure: { value: 0.95 }, uRes: U.uRes, uTime: U.uTime },
  vertexShader: FSQ_VERT,
  fragmentShader: /* glsl */`
  uniform sampler2D tMain; uniform float uExposure, uTime; uniform vec2 uRes; varying vec2 vUv;
  vec3 aces(vec3 x){ return clamp((x*(2.51*x + 0.03))/(x*(2.43*x + 0.59) + 0.14), 0.0, 1.0); }
  void main(){
    vec3 c = texture(tMain, vUv).rgb*uExposure;
    c = aces(c);
    float lum = dot(c, vec3(0.2126, 0.7152, 0.0722));
    c = clamp(mix(vec3(lum), c, 1.18), 0.0, 1.0);
    vec2 q = vUv - 0.5;
    c *= 1.0 - 0.32*dot(q, q)*1.6;
    c = pow(c, vec3(1.0/2.2));
    float n = fract(sin(dot(gl_FragCoord.xy + fract(uTime)*91.0, vec2(12.9898, 78.233)))*43758.5453);
    c += (n - 0.5)/255.0*1.5;
    gl_FragColor = vec4(c, 1.0);
  }`,
  depthTest: false, depthWrite: false,
});

const PRESETS = {
  hero:    () => ({ pos: new THREE.Vector3(0, -4.4, riverZ(0)), yaw: Math.atan(riverSlope(0)) + 0.05, pitch: 0.17 }),
  ceiling: () => ({ pos: new THREE.Vector3(-6, -2.3, riverZ(-6) + 2), yaw: Math.atan(riverSlope(-6)) + 0.3, pitch: 0.42 }),

function goPreset(name) {
  const p = PRESETS[name]();
  nav.trans = { t: 0, dur: 3.2, from: { pos: nav.pos.clone(), yaw: nav.yaw, pitch: nav.pitch }, to: p };
  nav.yawVel = 0;
}
const wrapAngle = a => Math.atan2(Math.sin(a), Math.cos(a));
const ease = t => t * t * (3 - 2 * t);
const dz = v => Math.sign(v) * Math.max(0, Math.abs(v) - 0.08) / 0.92;
const SPEED = 1.05;

function updateNav(dt, t) {
  if (nav.trans) {
    const tr = nav.trans; tr.t += dt / tr.dur;
    const k = ease(Math.min(1, tr.t));
    nav.pos.lerpVectors(tr.from.pos, tr.to.pos, k);
    nav.yaw = tr.from.yaw + wrapAngle(tr.to.yaw - tr.from.yaw) * k;
    nav.pitch = tr.from.pitch + (tr.to.pitch - tr.from.pitch) * k;
    if (tr.t >= 1) { nav.trans = null; nav.pitchBase = tr.to.pitch; nav.yaw = tr.to.yaw; }
    return;
  }
  let yawRate = 0, pitchT = nav.pitchBase, vyOverride = null;
  if (nav.tour) {
    nav.tourT += dt;
    const dirSign = Math.cos(nav.yaw) >= 0 ? 1 : -1;
    const want = (dirSign > 0 ? 0 : Math.PI) + Math.atan(riverSlope(nav.pos.x)) * dirSign;
    const lateral = (nav.pos.z - riverZ(nav.pos.x)) * dirSign;
    yawRate = Math.max(-0.18, Math.min(0.18, wrapAngle(want - nav.yaw - lateral * 0.012) * 0.25)) + 0.07 * Math.sin(nav.tourT * 0.043);
    pitchT = 0.12 + 0.2 * Math.sin(nav.tourT * 0.051) + 0.08 * Math.sin(nav.tourT * 0.13);
    const yT = -4.5 + 2.8 * Math.sin(nav.tourT * 0.023);
    vyOverride = Math.max(-0.22, Math.min(0.22, (yT - nav.pos.y) * 0.12));
  } else if (pointer.active && !pointer.overUI) {
    yawRate = dz(pointer.x) * 0.42;
    pitchT = nav.pitchBase - dz(pointer.y) * 0.6;
  }
  nav.yawVel += (yawRate - nav.yawVel) * (1 - Math.exp(-dt * 1.6));
  nav.yaw += nav.yawVel * dt;
  nav.pitch += (Math.max(-0.75, Math.min(0.85, pitchT)) - nav.pitch) * (1 - Math.exp(-dt * 1.3));
  // the lake gently turns you back from the shadowed rim
  const r = Math.hypot(nav.pos.x / LAKE_A, nav.pos.z / LAKE_B);
  if (r > 0.8) {
    const toC = Math.atan2(-nav.pos.z / LAKE_B * LAKE_A, -nav.pos.x / LAKE_A * LAKE_B);
    const w = smooth(0.8, 0.93, r);
    nav.yaw += wrapAngle(toC - nav.yaw) * w * dt * 0.7;
  }
  const hs = SPEED * Math.max(0.7, Math.cos(nav.pitch));
  nav.pos.x += Math.cos(nav.yaw) * hs * dt;
  nav.pos.z += Math.sin(nav.yaw) * hs * dt;
  let vy = vyOverride !== null ? vyOverride : Math.sin(nav.pitch) * SPEED * 0.7;
  if (vy > 0) vy *= 1 - smooth(-2.2, -0.85, nav.pos.y); else vy *= 1 - smooth(-10.0, -12.2, nav.pos.y);
  nav.pos.y = Math.max(-12.4, Math.min(-0.8, nav.pos.y + vy * dt));
}

const clock = new THREE.Clock();

function frame() {

  updateNav(dt, time);

  fwd.set(Math.cos(nav.pitch) * Math.cos(nav.yaw), Math.sin(nav.pitch), Math.cos(nav.pitch) * Math.sin(nav.yaw));
  camera.position.copy(nav.pos);

  camera.updateMatrixWorld();
  U.uFwd.value.copy(fwd);
  dome.position.copy(camera.position);
  surface.position.set(camera.position.x, 0, camera.position.z);

  // snorkeler: lazy kick, slow drift
  legs[0].rotation.z = Math.sin(time * 2.4) * 0.28; legs[1].rotation.z = -Math.sin(time * 2.4) * 0.28;
  snorkeler.position.y = -0.24 + Math.sin(time * 0.8) * 0.03;
  snorkeler.position.x += Math.cos(-snorkeler.rotation.y) * 0.12 * dt;
  snorkeler.position.z += Math.sin(-snorkeler.rotation.y) * 0.12 * dt;

  raysMat.uniforms.uInvVP.value.copy(camera.matrixWorld).multiply(camera.projectionMatrixInverse);
  raysMat.uniforms.uCamPos.value.copy(camera.position);
  raysMat.uniforms.uCamFwd.value.copy(fwd);

  renderer.setRenderTarget(rtBg); renderer.setClearColor(0x0d4c4c, 1); renderer.clear(true, true, false);
  renderer.render(bgScene, camera);
  renderer.setRenderTarget(rtRays); renderer.clear(true, false, false);
  renderer.render(raysScene, orthoCam);
  renderer.setRenderTarget(rtMain); renderer.clear(true, true, false);
  renderer.render(compScene, orthoCam);
  renderer.render(nearScene, camera);
  renderer.setRenderTarget(null);
  renderer.render(finalScene, orthoCam);

  // gentle automatic quality fit, only until the viewer chooses
  perfT += dt; perfFrames++;
  if (!userPickedQuality && perfT > 3.5 && autoChecks < 3) {
    const fps = perfFrames / perfT; autoChecks++;
    if (fps < 34 && quality !== 'low') applyQuality(quality === 'high' ? 'medium' : 'low');
    else if (fps > 57 && quality === 'medium' && autoChecks === 1) applyQuality('high');
    perfT = 0; perfFrames = 0;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
